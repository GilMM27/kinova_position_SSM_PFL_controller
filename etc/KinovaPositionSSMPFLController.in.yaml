# Set all regional force/stiffness parameters in the controller configuration.
# SSMPFL.Weight is optional: omit it for hard speed rows, or set a positive
# value to penalize speed-limit slack.
Managed: true
PositionTask:
  Weight: 5.0
  Stiffness: 5.0
PostureTask:
  Weight: 0.1
  Stiffness: 1.0
SSMPFL:
  # Weight: 1 # soft QP row penalty; speed bounds can be exceeded
  ClampRobotSpeedBudget: true
  StoppingTimeSeconds: 0.5
  MaxSampleAgeSeconds: 0.25
  MaxModelWitnessErrorM: 0.25
  MinDirectionalInverseMass: 1.0e-12
  MinMassEigenvalue: 1.0e-9
  Regions:
    head: { ForceMaxN: 65.0, StiffnessNPerM: 150000.0, DistanceMarginM: 0.05 }
    torso: { ForceMaxN: 110.0, StiffnessNPerM: 50000.0, DistanceMarginM: 0.05 }
    left_upper_arm:
      { ForceMaxN: 150.0, StiffnessNPerM: 30000.0, DistanceMarginM: 0.05 }
    left_forearm:
      { ForceMaxN: 160.0, StiffnessNPerM: 40000.0, DistanceMarginM: 0.05 }
    left_hand:
      { ForceMaxN: 140.0, StiffnessNPerM: 75000.0, DistanceMarginM: 0.05 }
    right_upper_arm:
      { ForceMaxN: 150.0, StiffnessNPerM: 30000.0, DistanceMarginM: 0.05 }
    right_forearm:
      { ForceMaxN: 160.0, StiffnessNPerM: 40000.0, DistanceMarginM: 0.05 }
    right_hand:
      { ForceMaxN: 140.0, StiffnessNPerM: 75000.0, DistanceMarginM: 0.05 }
    left_thigh:
      { ForceMaxN: 220.0, StiffnessNPerM: 50000.0, DistanceMarginM: 0.05 }
    left_lower_leg:
      { ForceMaxN: 130.0, StiffnessNPerM: 60000.0, DistanceMarginM: 0.05 }
    left_foot:
      { ForceMaxN: 130.0, StiffnessNPerM: 60000.0, DistanceMarginM: 0.05 }
    right_thigh:
      { ForceMaxN: 220.0, StiffnessNPerM: 50000.0, DistanceMarginM: 0.05 }
    right_lower_leg:
      { ForceMaxN: 130.0, StiffnessNPerM: 60000.0, DistanceMarginM: 0.05 }
    right_foot:
      { ForceMaxN: 130.0, StiffnessNPerM: 60000.0, DistanceMarginM: 0.05 }